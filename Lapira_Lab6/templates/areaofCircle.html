<!DOCTYPE html>
<html>
<head>
    <title>Area of Circle</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='work.css') }}">
</head>
<body class="page-circle">
    <nav class="top-nav">
        <div class="nav-icons">
            <a href="{{ url_for('index') }}" class="icon">🏠</a>
            <a href="{{ url_for('profile') }}" class="icon">👤</a>
            <a href="{{ url_for('works') }}" class="icon">📚</a>
            <a href="{{ url_for('contact') }}" class="icon">📞</a>
        </div>
    </nav>

    <main class="work-section">
        <div class="work-box">
            <div class="work-content">
                <h2>Get Area of Circle</h2>
                    <form action="/areaofCircle" method="post" class="works-form">
                    <label for="radius" class="form-label">Enter radius:</label>
                    <input type="number" id="radius" name="radius" step="any" required class="form-input">
                    <input type="submit" value="Calculate Area" class="form-submit">
                </form>
                {% if result is not none %}
                    <div class="result-container">
                        <p class="result-text">Area of Circle: <strong class="result-value">{{ result }}</strong></p>
                    </div>
                {% endif %}
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
