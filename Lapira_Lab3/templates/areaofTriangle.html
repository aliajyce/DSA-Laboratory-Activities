<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Area of Triangle</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='work.css') }}">
</head>
<body class="page-triangle">
    <nav class="top-nav">
        <div class="nav-icons">
            <a href="{{ url_for('index') }}" class="icon">🏠</a>
            <a href="{{ url_for('profile') }}" class="icon">👤</a>
            <a href="{{ url_for('works') }}" class="icon">📚</a>
            <a href="{{ url_for('contact') }}" class="icon">📞</a>
        </div>
    </nav>

    <main class="work-section">
        <div class="work-box">
            <div class="work-content">
                <h2>Get Area of Triangle</h2>

                <form action="/areaofTriangle" method="post" class="works-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="base" class="form-label">Enter base:</label>
                            <input type="number" id="base" name="base" step="any" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="height" class="form-label">Enter height:</label>
                            <input type="number" id="height" name="height" step="any" required class="form-input">
                        </div>
                    </div>

                    <div class="form-actions">
                        <input type="submit" value="Calculate Area" class="form-submit">
                    </div>
                </form>

                {% if result is not none %}
                <div class="result-container">
                    <p class="result-text">Area of Triangle: <strong class="result-value">{{ result }}</strong></p>
                </div>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
