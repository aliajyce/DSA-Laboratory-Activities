<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Infix to Postfix Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='work.css') }}">
</head>

<body class="page-inpost">
    <nav class="top-nav">
        <div class="nav-icons">
            <a href="{{ url_for('index') }}" class="icon">🏠</a>
            <a href="{{ url_for('profile') }}" class="icon">👤</a>
            <a href="{{ url_for('works') }}" class="icon">📚</a>
            <a href="{{ url_for('contact') }}" class="icon">📞</a>
        </div>
    </nav>

    <main class="work-section">
        <div class="work-box">
            <div class="work-content">
                <h2>Convert Infix to Postfix</h2>

                <form action="{{ url_for('inpostfix') }}" method="post" class="works-form">
                    <label for="inputString" class="form-label">Enter an infix expression:</label>
                    <input type="text" id="inputString" name="inputString" required class="form-input">
                    <input type="submit" value="Convert to Postfix" class="form-submit">
                </form>

                {% if result %}
                <div class="result-container">
                    <p class="result-text">Converted expression: <strong class="result-value">{{ result }}</strong></p>
                </div>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
